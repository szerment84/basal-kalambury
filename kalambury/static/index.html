<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>basal kalambury</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>basal <span>kalambury</span></h1>
      <p class="lead" data-t="lead"></p>
    </div>
    <div class="side">
      <div class="seg langs"><button data-lang="pl">PL</button><button data-lang="en">EN</button></div>
      <div id="model" class="badge"></div>
    </div>
  </header>

  <main>
    <section class="card board">
      <div class="switches">
        <div class="seg modes"><button data-mode="game" class="on" data-t="game"></button><button data-mode="free" data-t="free"></button></div>
        <div class="seg packs"><button data-pack="quickdraw">Quick, Draw!</button><button data-pack="nerd" data-t="nerd"></button></div>
      </div>
      <div id="task" class="task">
        <div class="prompt"><span data-t="draw"></span> <b id="target">…</b></div>
        <div class="score" id="score"></div>
      </div>
      <div class="timer" id="timerbar"><i id="timer"></i></div>
      <div class="paper"><canvas id="canvas"></canvas><div id="banner" class="banner" hidden></div></div>
      <div class="tools">
        <button id="undo" title="Z" data-t="undo"></button>
        <button id="clear" title="C" data-t="clear"></button>
        <button id="next" title="N" data-t="next"></button>
      </div>
    </section>

    <section class="card mind">
      <div class="say"><span id="say"></span><span id="busy" class="busy" hidden data-t="busy"></span></div>
      <div class="bars" id="bars"></div>
      <div class="tline" id="tline"></div>
      <div class="stats" id="stats"></div>
      <div class="eye">
        <img id="seen" alt="">
        <p data-t="eye"></p>
      </div>
    </section>
  </main>

  <details class="card words">
    <summary id="wordsum"></summary>
    <p id="wordlist"></p>
  </details>

  <footer data-t="footer"></footer>
  <script src="app.js"></script>
</body>
</html>
